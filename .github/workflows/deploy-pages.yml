name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Escolhe o base: domínio próprio/CNAME na raiz, ou /<repo>/ no GitHub Pages.
      - name: Resolve base path
        id: base
        env:
          REPO: ${{ github.event.repository.name }}
        run: |
          if [ -f public/CNAME ] || [ -f CNAME ]; then
            echo "value=/" >> "$GITHUB_OUTPUT"
            echo "Usando raiz (CNAME encontrado)."
          else
            echo "value=/$REPO/" >> "$GITHUB_OUTPUT"
            echo "Usando subpasta /$REPO/."
          fi

      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.base.outputs.value }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
